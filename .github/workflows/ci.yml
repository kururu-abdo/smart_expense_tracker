name: Verify Masar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: masar
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: masar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-never-deploy-12345678901234567890
      DATABASE_URL: sqlite:///./ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://masar:test-only-password@localhost:5432/masar_test
      - run: alembic upgrade head && alembic check
      - run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://masar:test-only-password@localhost:5432/masar_test
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --dart-define=API_BASE_URL=https://api.example.com/api/v1
